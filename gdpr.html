function ArticleCard({ article, onClick, isSelected }) {
  const ch = CHAPTER_COLORS[article.chapter] || CHAPTER_COLORS["I"];
  const rel = RELEVANCE_STYLE[article.consentRelevance];
  return (
    <div onClick={() => onClick(article)} style={{
      cursor: "pointer", borderRadius: 8,
      border: isSelected ? `2px solid ${ch.accent}` : "1.5px solid #e8e8e8",
      background: isSelected ? ch.bg : "#fff",
      padding: "9px 12px", marginBottom: 5,
      transition: "all 0.15s",
      boxShadow: isSelected ? `0 2px 10px ${ch.accent}28` : "0 1px 2px #0001",
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
        <span style={{
          fontWeight: 800, fontSize: 12, color: ch.accent,
          background: ch.light, borderRadius: 5, padding: "2px 7px", minWidth: 38, textAlign: "center"
        }}>Art.{article.num}</span>
        <span style={{ fontWeight: 600, fontSize: 12, color: "#1a1a2e", flex: 1, lineHeight: 1.35 }}>
          {article.name}
        </span>
        <span style={{ fontSize: 10, fontWeight: 700, borderRadius: 8, padding: "2px 6px",
          background: rel.bg, color: rel.color, whiteSpace: "nowrap", border: `1px solid ${rel.border}`
        }}>{rel.label}</span>
      </div>
    </div>
  );
}

              {article.consentRelevance === "Yes" && <span style={{ color: "#155724", fontWeight: 700 }}>✓ Directly drives CMP configuration requirements. </span>}
              {article.consentRelevance === "Partial" && <span style={{ color: "#856404", fontWeight: 700 }}>~ Indirectly relevant — consider in broader data protection workflows. </span>}
              {article.consentRelevance === "No" && <span style={{ color: "#721c24", fontWeight: 700 }}>✗ Not directly applicable to consent/preference management workflows. </span>}
              Review this article when designing consent flows, preference centres, DSR workflows, or vendor assessments.
            </div>
          </div>
        )}
        {tab === "ccpa" && (
          <div>
            <div style={{ fontWeight: 700, color: "#1a1a2e", marginBottom: 8, fontSize: 13 }}>🇺🇸 CCPA / CPRA Position</div>
            <p style={{
              fontSize: 13, lineHeight: 1.72, color: "#333",
              background: "#f0f6ff", borderRadius: 8, padding: 13,
              borderLeft: "4px solid #1565c0", marginBottom: 18
            }}>{article.ccpa}</p>
            <div style={{ fontWeight: 700, color: "#1a1a2e", marginBottom: 10, fontSize: 13 }}>
              ⚖️ Key Differences: GDPR vs CCPA / CPRA
            </div>
            {article.ccpaDiff.map((d, i) => (
              <div key={i} style={{ display: "flex", gap: 9, marginBottom: 8, alignItems: "flex-start" }}>
                <span style={{ color: "#1565c0", fontSize: 14, marginTop: 2, flexShrink: 0 }}>▸</span>
                <span style={{ fontSize: 13, color: "#333", lineHeight: 1.65 }}>{d}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function App() {
  const [selected, setSelected] = useState(ARTICLES[0]);
  const [search, setSearch] = useState("");
  const [filterChapter, setFilterChapter] = useState("All");
  const [filterConsent, setFilterConsent] = useState("All");

  const filtered = ARTICLES.filter(a => {
    const q = search.toLowerCase();
    const matchSearch = !search ||
      a.name.toLowerCase().includes(q) ||
      a.summary.toLowerCase().includes(q) ||
      a.tags.some(t => t.toLowerCase().includes(q)) ||
      `article ${a.num}`.includes(q) || `art ${a.num}`.includes(q) || `art.${a.num}`.includes(q);
    const matchChapter = filterChapter === "All" || a.chapter === filterChapter;
    const matchConsent = filterConsent === "All" || a.consentRelevance === filterConsent;
    return matchSearch && matchChapter && matchConsent;
  });

  const chapterGroups = {};
  filtered.forEach(a => {
    if (!chapterGroups[a.chapter]) chapterGroups[a.chapter] = { name: a.chapterName, articles: [] };
    chapterGroups[a.chapter].articles.push(a);
  });

  const counts = {
    Yes: ARTICLES.filter(a => a.consentRelevance === "Yes").length,
    Partial: ARTICLES.filter(a => a.consentRelevance === "Partial").length,
    No: ARTICLES.filter(a => a.consentRelevance === "No").length,
  };

  return (
    <div style={{ fontFamily: "'Segoe UI', system-ui, sans-serif", background: "#eef0f5", height: "100vh", display: "flex", flexDirection: "column", overflow: "hidden" }}>
      {/* Top bar */}
      <div style={{
        background: "linear-gradient(135deg, #0a1929, #1565c0)",
        padding: "0 18px", display: "flex", alignItems: "center", gap: 12,
        height: 50, flexShrink: 0, boxShadow: "0 2px 10px rgba(0,0,0,0.35)"
      }}>
        <div style={{ fontSize: 17 }}>🛡️</div>
        <div>
          <div style={{ color: "#fff", fontWeight: 800, fontSize: 14, letterSpacing: -0.3 }}>GDPR Learning Hub</div>
          <div style={{ color: "#90caf9", fontSize: 9.5, letterSpacing: 0.4 }}>
            Arts. 1–35 · Consent & Pref. Mgmt · CCPA/CPRA Comparison
          </div>
        </div>
        <div style={{ marginLeft: "auto", display: "flex", gap: 5, alignItems: "center" }}>
          <div style={{ display: "flex", gap: 8, marginRight: 10 }}>
            {[["Yes","#4caf50","Direct"], ["Partial","#ff9800","Partial"], ["No","#f44336","N/A"]].map(([k,c,l]) => (
              <div key={k} style={{ display: "flex", alignItems: "center", gap: 4 }}>
                <div style={{ width: 7, height: 7, borderRadius: "50%", background: c }} />
                <span style={{ color: "#ccc", fontSize: 10 }}>{l} ({counts[k]})</span>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div style={{ flex: 1, display: "flex", overflow: "hidden" }}>
        {/* Left: article list */}
        <div style={{ width: 285, flexShrink: 0, background: "#fff", display: "flex", flexDirection: "column", borderRight: "1px solid #e0e0e0" }}>
          <div style={{ padding: "9px 9px 6px", borderBottom: "1px solid #f0f0f0" }}>
            <input
              placeholder="🔍 Search articles, keywords, tags..."
              value={search} onChange={e => setSearch(e.target.value)}
              style={{ width: "100%", border: "1.5px solid #e3e8f0", borderRadius: 7, padding: "6px 10px", fontSize: 12, outline: "none", boxSizing: "border-box", fontFamily: "inherit" }}
            />
            <div style={{ display: "flex", gap: 4, marginTop: 5 }}>
              {[["filterChapter", filterChapter, setFilterChapter, ["All","I","II","III","IV"], (c) => c === "All" ? "All Chapters" : `Ch. ${c}`],
                ["filterConsent", filterConsent, setFilterConsent, ["All","Yes","Partial","No"], (c) => c === "All" ? "All Relevance" : c]
              ].map(([key, val, setter, opts, label]) => (
                <select key={key} value={val} onChange={e => setter(e.target.value)} style={{
                  flex: 1, border: "1px solid #e0e0e0", borderRadius: 6, padding: "4px 5px",
                  fontSize: 10.5, background: "#fafafa", outline: "none"
                }}>
                  {opts.map(o => <option key={o} value={o}>{label(o)}</option>)}
                </select>
              ))}
            </div>
          </div>
          <div style={{ flex: 1, overflowY: "auto", padding: "7px 7px" }}>
            {Object.keys(chapterGroups).sort().map(ch => (
              <div key={ch}>
                <div style={{
                  fontSize: 9.5, fontWeight: 800, letterSpacing: 1.5,
                  color: CHAPTER_COLORS[ch]?.accent || "#666",
                  padding: "6px 5px 3px", textTransform: "uppercase"
                }}>Ch. {ch} · {chapterGroups[ch].name}</div>
                {chapterGroups[ch].articles.map(a => (
                  <ArticleCard key={a.num} article={a} onClick={setSelected} isSelected={selected?.num === a.num} />
                ))}
              </div>
            ))}
            {filtered.length === 0 && (
              <div style={{ textAlign: "center", color: "#aaa", padding: 20, fontSize: 12 }}>No articles match</div>
            )}
          </div>
        </div>

        {/* Middle: article detail */}
        <div style={{ flex: 1, background: "#fff", overflow: "hidden", display: "flex", flexDirection: "column" }}>
          {selected
            ? <ArticleDetail article={selected} />
            : <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100%", color: "#bbb", fontSize: 14 }}>← Select an article</div>
          }
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
    </script>
</body>
</html>
